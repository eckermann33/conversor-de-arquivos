name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    name: Testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Rodar testes
        run: npm test

  estrutura:
    name: Arquivos essenciais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir se o app carrega todos os scripts
        run: |
          set -e
          for f in index.html sw.js manifest.webmanifest \
                   assets/css/style.css assets/js/formats.js \
                   assets/js/vendor.js assets/js/converters.js assets/js/app.js; do
            test -f "$f" || { echo "faltando: $f"; exit 1; }
          done
          for f in formats vendor converters app; do
            grep -q "assets/js/$f.js" index.html || { echo "index.html não carrega $f.js"; exit 1; }
          done
          node --check assets/js/formats.js
          node --check assets/js/vendor.js
          node --check assets/js/converters.js
          node --check assets/js/app.js
          node --check sw.js
          node --check tools/serve.mjs
          echo "estrutura ok"
