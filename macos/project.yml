# Projeto para o XcodeGen: `xcodegen generate` cria o ConvrtVideo.xcodeproj.
# Assim o .xcodeproj não precisa ficar versionado (ele muda a cada abertura do Xcode).
name: ConvrtVideo

options:
  bundleIdPrefix: com.convrt
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  ConvrtVideo:
    type: application
    platform: macOS
    sources:
      - path: ConvrtVideo
        excludes:
          - "Resources/Info.plist"
          - "Resources/ConvrtVideo.entitlements"
          - "Resources/.gitkeep"
    settings:
      base:
        PRODUCT_NAME: ConvrtVideo
        PRODUCT_BUNDLE_IDENTIFIER: com.convrt.video
        INFOPLIST_FILE: ConvrtVideo/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ConvrtVideo/Resources/ConvrtVideo.entitlements
        # O app precisa executar o ffmpeg como subprocesso; a caixa de areia
        # do macOS bloqueia isso, então ela fica desligada (app pessoal, fora da App Store).
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
